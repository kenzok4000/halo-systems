<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1094" viewBox="0 0 1400 1094" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a3a29a"/></marker></defs>
<rect width="1400" height="1094" fill="#1a1a19"/>
<text x="36.0" y="56.0" font-size="30" font-weight="700" text-anchor="start" fill="#f0efec">How Halo turns a lightning strike into a crew brief and an alert</text>
<text x="36.0" y="88.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">NVIDIA Nemotron reads the job before take-off; in a separate measurement it picked a check team’s next strike as well as a rule did.</text>
<text x="36.0" y="112.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Code makes the plan, flies the drones and runs the station: no language model flies a drone or decides an alert.</text>
<rect x="36.0" y="146.0" width="302.0" height="808.0" rx="14" fill="#232322" stroke="#383835" stroke-width="1.5"/>
<text x="54.0" y="176.0" font-size="14" font-weight="700" text-anchor="start" fill="#f0efec" letter-spacing="1.4">BEFORE TAKE-OFF</text>
<text x="54.0" y="200.0" font-size="15" font-weight="400" text-anchor="start" fill="#c3c2b7">Once per job</text>
<rect x="376.0" y="146.0" width="302.0" height="808.0" rx="14" fill="#232322" stroke="#383835" stroke-width="1.5"/>
<text x="394.0" y="176.0" font-size="14" font-weight="700" text-anchor="start" fill="#f0efec" letter-spacing="1.4">IN FLIGHT</text>
<text x="394.0" y="200.0" font-size="15" font-weight="400" text-anchor="start" fill="#c3c2b7">The drones and their supervisor</text>
<rect x="716.0" y="146.0" width="302.0" height="808.0" rx="14" fill="#232322" stroke="#383835" stroke-width="1.5"/>
<text x="734.0" y="176.0" font-size="14" font-weight="700" text-anchor="start" fill="#f0efec" letter-spacing="1.4">GROUND STATION</text>
<text x="734.0" y="200.0" font-size="15" font-weight="400" text-anchor="start" fill="#c3c2b7">Once a second, no language model</text>
<rect x="1056.0" y="146.0" width="302.0" height="808.0" rx="14" fill="#232322" stroke="#383835" stroke-width="1.5"/>
<text x="1074.0" y="176.0" font-size="14" font-weight="700" text-anchor="start" fill="#f0efec" letter-spacing="1.4">WHO GETS WHAT</text>
<text x="1074.0" y="200.0" font-size="15" font-weight="400" text-anchor="start" fill="#c3c2b7">As soon as the station knows</text>
<rect x="54.0" y="222.0" width="266.0" height="152.0" rx="10" fill="#2a2a28" stroke="#5a5955" stroke-width="2"/>
<text x="68.0" y="252.0" font-size="18.5" font-weight="600" text-anchor="start" fill="#f0efec">Operator</text>
<text x="68.0" y="278.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Types the job in plain words:</text>
<text x="68.0" y="300.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">“check last night’s strikes on</text>
<text x="68.0" y="322.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">the valley floor”</text>
<rect x="54.0" y="408.0" width="266.0" height="152.0" rx="10" fill="#26331a" stroke="#8fd400" stroke-width="2.5"/>
<text x="68.0" y="438.0" font-size="18.5" font-weight="700" text-anchor="start" fill="#c4ec7a">Nemotron valley compiler</text>
<text x="68.0" y="464.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Nemotron 3 Nano on Nebius</text>
<text x="68.0" y="486.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Token Factory reads the</text>
<text x="68.0" y="508.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">drones, areas and strikes the</text>
<text x="68.0" y="530.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">job means, or refuses it</text>
<rect x="54.0" y="594.0" width="266.0" height="152.0" rx="10" fill="#3a2a12" stroke="#f59e0b" stroke-width="2.5"/>
<text x="68.0" y="624.0" font-size="18.5" font-weight="700" text-anchor="start" fill="#fcd08a">Plan check</text>
<text x="68.0" y="650.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Code picks the strikes and</text>
<text x="68.0" y="672.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">the squads, within drone and</text>
<text x="68.0" y="694.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">battery limits</text>
<rect x="54.0" y="780.0" width="266.0" height="152.0" rx="10" fill="#2a2a28" stroke="#5a5955" stroke-width="2"/>
<text x="68.0" y="810.0" font-size="18.5" font-weight="600" text-anchor="start" fill="#f0efec">Patrol plan</text>
<text x="68.0" y="836.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Squads, their areas, the</text>
<text x="68.0" y="858.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">strikes to look at first, and</text>
<text x="68.0" y="880.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">how long they fly</text>
<rect x="394.0" y="817.2" width="266.0" height="114.8" rx="10" fill="#26331a" stroke="#8fd400" stroke-width="2.5"/>
<text x="408.0" y="847.2" font-size="18.5" font-weight="700" text-anchor="start" fill="#c4ec7a">Strike picker, optional</text>
<text x="408.0" y="873.2" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">For a 4-drone check team,</text>
<text x="408.0" y="895.2" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Nemotron picks the next</text>
<text x="408.0" y="917.2" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">strike; a rule did as well</text>
<rect x="394.0" y="668.4" width="266.0" height="114.8" rx="10" fill="#2a2a28" stroke="#5a5955" stroke-width="2"/>
<text x="408.0" y="698.4" font-size="18.5" font-weight="600" text-anchor="start" fill="#f0efec">Supervisor, every 5 s</text>
<text x="408.0" y="724.4" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">On a typed valley job, rules</text>
<text x="408.0" y="746.4" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">set the formation</text>
<rect x="494.2" y="772.2" width="155.8" height="22.0" rx="11" fill="#8fd400" stroke="#8fd400" stroke-width="1"/>
<text x="572.1" y="787.7" font-size="12" font-weight="700" text-anchor="middle" fill="#0b0b0b">NEMOTRON IN THE LAB</text>
<rect x="394.0" y="519.6" width="266.0" height="114.8" rx="10" fill="#3a2a12" stroke="#f59e0b" stroke-width="2.5"/>
<text x="408.0" y="549.6" font-size="18.5" font-weight="700" text-anchor="start" fill="#fcd08a">Safety validator</text>
<text x="408.0" y="575.6" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Checks every order and</text>
<text x="408.0" y="597.6" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">strike pick, the operator’s</text>
<text x="408.0" y="619.6" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">too: clamps or rejects it</text>
<rect x="394.0" y="370.8" width="266.0" height="114.8" rx="10" fill="#3a2a12" stroke="#f59e0b" stroke-width="2.5"/>
<text x="408.0" y="400.8" font-size="18.5" font-weight="700" text-anchor="start" fill="#fcd08a">Controller, 50 Hz</text>
<text x="408.0" y="426.8" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">A safety filter keeps each</text>
<text x="408.0" y="448.8" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">drone clear of the others,</text>
<text x="408.0" y="470.8" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">obstacles and the ground</text>
<rect x="394.0" y="222.0" width="266.0" height="114.8" rx="10" fill="#2a2a28" stroke="#5a5955" stroke-width="2"/>
<text x="408.0" y="252.0" font-size="18.5" font-weight="600" text-anchor="start" fill="#f0efec">Drones</text>
<text x="408.0" y="278.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Cameras look down for heat</text>
<text x="408.0" y="300.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">and ahead for smoke; each</text>
<text x="408.0" y="322.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">drone measures the wind</text>
<rect x="734.0" y="222.0" width="266.0" height="152.0" rx="10" fill="#2a2a28" stroke="#5a5955" stroke-width="2"/>
<text x="748.0" y="252.0" font-size="18.5" font-weight="600" text-anchor="start" fill="#f0efec">Locate fires</text>
<text x="748.0" y="278.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Places fires from thermal</text>
<text x="748.0" y="300.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">finds and smoke bearings,</text>
<text x="748.0" y="322.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">and maps the burning ground</text>
<rect x="734.0" y="408.0" width="266.0" height="152.0" rx="10" fill="#2a2a28" stroke="#5a5955" stroke-width="2"/>
<text x="748.0" y="438.0" font-size="18.5" font-weight="600" text-anchor="start" fill="#f0efec">Spread forecast</text>
<text x="748.0" y="464.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">A Rothermel ensemble on</text>
<text x="748.0" y="486.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">fuel, slope and the wind,</text>
<text x="748.0" y="508.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">every 2 min, sooner when a</text>
<text x="748.0" y="530.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">fire is new or grows</text>
<rect x="734.0" y="594.0" width="266.0" height="152.0" rx="10" fill="#2a2a28" stroke="#5a5955" stroke-width="2"/>
<text x="748.0" y="624.0" font-size="18.5" font-weight="600" text-anchor="start" fill="#f0efec">Crew brief</text>
<text x="748.0" y="650.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Where the fire is and which</text>
<text x="748.0" y="672.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">way its head will run, with a</text>
<text x="748.0" y="694.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">cone of likely directions</text>
<rect x="734.0" y="780.0" width="266.0" height="152.0" rx="10" fill="#3a2a12" stroke="#f59e0b" stroke-width="2.5"/>
<text x="748.0" y="810.0" font-size="18.5" font-weight="700" text-anchor="start" fill="#fcd08a">Alert check</text>
<text x="748.0" y="836.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Fixed rules set each zone’s</text>
<text x="748.0" y="858.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">alert level; each alert is</text>
<text x="748.0" y="880.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">checked first</text>
<rect x="1074.0" y="222.0" width="266.0" height="152.0" rx="10" fill="#16263b" stroke="#3987e5" stroke-width="2.5"/>
<text x="1088.0" y="252.0" font-size="18.5" font-weight="700" text-anchor="start" fill="#a9cdf7">Fire dispatch</text>
<text x="1088.0" y="278.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Under the pre-signed rules a</text>
<text x="1088.0" y="300.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">typed job uses, a card for</text>
<text x="1088.0" y="322.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">every fire the station locates</text>
<rect x="1074.0" y="408.0" width="266.0" height="152.0" rx="10" fill="#16263b" stroke="#3987e5" stroke-width="2.5"/>
<text x="1088.0" y="438.0" font-size="18.5" font-weight="700" text-anchor="start" fill="#a9cdf7">Operator</text>
<text x="1088.0" y="464.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Sees every card, brief and</text>
<text x="1088.0" y="486.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">alert; can cancel an alert,</text>
<text x="1088.0" y="508.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">give the all-clear or hold the</text>
<text x="1088.0" y="530.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">swarm low for aircraft</text>
<rect x="1074.0" y="594.0" width="266.0" height="152.0" rx="10" fill="#16263b" stroke="#3987e5" stroke-width="2.5"/>
<text x="1088.0" y="624.0" font-size="18.5" font-weight="700" text-anchor="start" fill="#a9cdf7">Fire crews</text>
<text x="1088.0" y="650.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">The brief, a map file, and an</text>
<text x="1088.0" y="672.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">update whenever the</text>
<text x="1088.0" y="694.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">forecast changes</text>
<rect x="1074.0" y="780.0" width="266.0" height="152.0" rx="10" fill="#16263b" stroke="#3987e5" stroke-width="2.5"/>
<text x="1088.0" y="810.0" font-size="18.5" font-weight="700" text-anchor="start" fill="#a9cdf7">Phones in the path</text>
<text x="1088.0" y="836.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">Zone alerts, from prepare to</text>
<text x="1088.0" y="858.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">emergency; simulated</text>
<text x="1088.0" y="880.0" font-size="17" font-weight="400" text-anchor="start" fill="#c3c2b7">phones only</text>
<path d="M 187.0 374 L 187.0 406" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 527.0 370.8 L 527.0 338.8" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 187.0 560 L 187.0 592" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 527.0 519.6 L 527.0 487.6" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 187.0 746 L 187.0 778" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 527.0 668.4000000000001 L 527.0 636.4" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 660 845.2 L 669 845.2 L 669 658.4000000000001 L 620 658.4000000000001 L 620 636.4" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 867.0 374 L 867.0 406" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 867.0 560 L 867.0 592" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 734 534 L 725 534 L 725 756 L 774 756 L 774 778" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 320 802 L 357.0 802 L 357.0 725.8000000000001 L 392 725.8000000000001" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 660 279.4 L 732 279.4" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1000 298.0 L 1072 298.0" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1000 484.0 L 1072 484.0" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1000 670.0 L 1072 670.0" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1000 856.0 L 1072 856.0" fill="none" stroke="#a3a29a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="36.0" y="979.0" width="26.0" height="20.0" rx="5" fill="#26331a" stroke="#8fd400" stroke-width="2"/>
<text x="72.0" y="994.0" font-size="16" font-weight="500" text-anchor="start" fill="#c3c2b7">NVIDIA Nemotron on Nebius Token Factory</text>
<rect x="432.0" y="979.0" width="26.0" height="20.0" rx="5" fill="#3a2a12" stroke="#f59e0b" stroke-width="2"/>
<text x="468.0" y="994.0" font-size="16" font-weight="500" text-anchor="start" fill="#c3c2b7">Safety check</text>
<rect x="598.2" y="979.0" width="26.0" height="20.0" rx="5" fill="#2a2a28" stroke="#5a5955" stroke-width="2"/>
<text x="634.2" y="994.0" font-size="16" font-weight="500" text-anchor="start" fill="#c3c2b7">No language model in the valley</text>
<rect x="907.9" y="979.0" width="26.0" height="20.0" rx="5" fill="#16263b" stroke="#3987e5" stroke-width="2"/>
<text x="943.9" y="994.0" font-size="16" font-weight="500" text-anchor="start" fill="#c3c2b7">Who receives it</text>
<text x="36.0" y="1032.0" font-size="16" font-weight="400" text-anchor="start" fill="#a3a29a">Without a key, recorded jobs replay Nemotron’s reading and new ones go to hand-written rules, as when the link drops; flight, the station and the alerts carry on.</text>
<text x="36.0" y="1056.0" font-size="16" font-weight="400" text-anchor="start" fill="#a3a29a">A check team flies only in the strike-check measurement, not in a typed job; if a Nemotron pick fails, the team keeps patrolling its square.</text>
</svg>
