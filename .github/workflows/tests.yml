name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[report]'
      - name: Unit tests (no network, no key)
        run: python -m unittest discover -s tests -v
      - name: Command line smoke test
        run: |
          halo list
          halo run open_transit --config improved+rule --seed 1000 > /dev/null
          halo mission-eval --sets heldout --out /tmp/mission_eval_baseline.json
