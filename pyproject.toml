[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmlab"
version = "0.1.0"
description = "Supervised drone-swarm formation testbed: a 50 Hz safety-filtered controller with an NVIDIA Nemotron supervisor on Nebius Token Factory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
report = ["matplotlib>=3.7"]

[project.scripts]
swarmlab = "swarmlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
