[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-systems"
version = "0.1.0"
description = "Halo Systems: supervised drone-swarm formation testbed. A 50 Hz safety-filtered controller with NVIDIA Nemotron on Nebius Token Factory as supervisor, mission compiler and test engineer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
report = ["matplotlib>=3.7"]

[project.scripts]
halo = "halo_systems.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
halo_systems = ["dashboard/static/*", "dashboard/static/vendor/*", "ai/*.json"]
