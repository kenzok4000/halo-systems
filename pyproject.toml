[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-systems"
version = "0.1.0"
description = "Halo Systems: autonomous drone swarms for wildfire scouting. A 50 Hz safety-filtered controller flies the drones; NVIDIA Nemotron on Nebius Token Factory supervises them, compiles missions and stress-tests them."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
report = ["matplotlib>=3.7"]

[project.scripts]
halo = "halo_systems.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
halo_systems = ["dashboard/static/*", "dashboard/static/vendor/*", "dashboard/static/models/*", "ai/*.json"]
